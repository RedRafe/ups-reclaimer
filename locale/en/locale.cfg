[mod-setting-description]
upsr-buffer-seconds=How much of each border item a reclaimed block keeps in stock on its inputs, and lets pile up on its outputs before it slows down. A bigger buffer rides out uneven supply better; what is in it is lost when you restore.

[upsr-gui]
title=UPS Reclaimer
hint=Click an entity to keep it real (red = not replaced).
