replaced=Replaced, click to keep real
clear=Clear
freeze=Reclaim
inputs=In, per second (click to switch off, red = crosses at 0)
outputs=Out, per second (click to switch off, red = crosses at 0)
flow-on=Crosses the border, click to switch off: its makers or users inside slow down
flow-off=Switched off, click to let it cross
flow-idle=Nothing left over at these settings, so it is left out

